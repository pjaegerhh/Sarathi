name: Deploy to Production Environment

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_STATIC_WEB_APP_NAME: 'sarathi'
  AZURE_RESOURCE_GROUP: 'sarathi-rg'
  NODE_VERSION: '22'

jobs:
  # Job 0: Detect Changes
  detect_changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      scheduler: ${{ steps.filter.outputs.scheduler }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed paths
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'components/**'
              - 'contexts/**'
              - 'styles/**'
              - 'assets/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'staticwebapp.config.json'
            scheduler:
              - 'scheduler/**'

  # Job 1: Build and Deploy Static Web App
  deploy_static_web_app:
    name: Deploy Static Web App (Production)
    runs-on: ubuntu-latest
    needs: detect_changes
    if: needs.detect_changes.outputs.frontend == 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_APP_ENVIRONMENT: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # NOTE: VITE_OPENAI_API_KEY removed - now stored securely as Supabase Edge Function secret
          # Set it with: supabase secrets set OPENAI_API_KEY=sk-your-key

      - name: Copy static web app config to dist
        run: cp staticwebapp.config.json dist/

      - name: Copy public folder contents to dist
        run: |
          if [ -d "public" ]; then
            echo "Copying public folder contents to dist..."
            cp -r public/* dist/ 2>/dev/null || echo "No files in public folder or already copied"
          fi

      - name: Verify dist folder contents
        run: |
          echo "Contents of dist folder:"
          ls -la dist/
          echo "Checking for manifest.json:"
          if [ -f dist/manifest.json ]; then
            echo "✅ manifest.json found in dist"
          else
            echo "❌ manifest.json NOT found in dist"
          fi

      - name: Clean up unnecessary files before deployment
        run: |
          # Remove only the most problematic files to reduce deployment size
          rm -rf node_modules
          rm -rf .git
          rm -rf .github
          rm -rf src
          rm -rf scripts
          rm -rf setup-infra
          rm -rf .documentation
          rm -rf .prompt
          rm -f *.md
          rm -f *.ps1
          rm -f *.backup
          rm -f .gitignore
          rm -f .cursorignore
          rm -f tsconfig*.json
          rm -f vite.config.ts
          # Keep essential files: index.html, package.json, staticwebapp.config.json, and dist folder
          echo "Files remaining after cleanup:"
          ls -la

      - name: Deploy to Azure Static Web App (Production)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          skip_app_build: true
        env:
          VITE_APP_ENVIRONMENT: production
          VITE_AZURE_STORAGE_ACCOUNT_NAME: sarathidocs
          VITE_AZURE_STORAGE_CONTAINER: documents
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # NOTE: VITE_OPENAI_API_KEY removed - now stored securely as Supabase Edge Function secret

  # Job 2: Deploy Supabase Ping Scheduler (Azure Function)
  deploy_scheduler:
    name: Deploy Scheduler (Supabase Ping)
    runs-on: ubuntu-22.04
    needs: detect_changes
    if: needs.detect_changes.outputs.scheduler == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Scheduler
        run: |
          cd scheduler
          npm ci
          npm run build
          npm prune --production

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure Functions Core Tools v4
        run: |
          curl -sL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > microsoft.gpg
          sudo mv microsoft.gpg /etc/apt/trusted.gpg.d/microsoft.gpg
          sudo sh -c 'echo "deb [arch=amd64] https://packages.microsoft.com/repos/microsoft-ubuntu-$(lsb_release -cs)-prod $(lsb_release -cs) main" > /etc/apt/sources.list.d/dotnetdev.list'
          sudo apt-get update
          sudo apt-get install -y azure-functions-core-tools-4

      - name: Deploy Scheduler Function App
        run: |
          cd scheduler
          func azure functionapp publish sarathi-scheduler --node

      - name: Configure Scheduler app settings
        env:
          SUPABASE_URL_VAL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY_VAL: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          az functionapp config appsettings set \
            --name sarathi-scheduler \
            --resource-group sarathi-rg \
            --settings \
              SUPABASE_URL="$SUPABASE_URL_VAL" \
              SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY_VAL"

  # Job 3: Deployment Summary
  deployment_summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [detect_changes, deploy_static_web_app, deploy_scheduler]
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "## 🚀 Production Environment Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Change Detection:" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend changes: ${{ needs.detect_changes.outputs.frontend }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Components:" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.detect_changes.outputs.frontend }}" == "true" ]; then
            if [ "${{ needs.deploy_static_web_app.result }}" == "success" ]; then
              echo "- ✅ Static Web App: ${{ env.AZURE_STATIC_WEB_APP_NAME }}" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ Static Web App: Deployment failed" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- ⏭️ Static Web App: Skipped (no changes)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.deploy_scheduler.result }}" == "success" ]; then
            echo "- ✅ Scheduler (Supabase Ping): sarathi-scheduler" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy_scheduler.result }}" == "failure" ]; then
            echo "- ❌ Scheduler: Deployment failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ Scheduler: Skipped (no changes or not run)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment:" >> $GITHUB_STEP_SUMMARY
          echo "- Resource Group: ${{ env.AZURE_RESOURCE_GROUP }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: main" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access:" >> $GITHUB_STEP_SUMMARY
          echo "- Static Web App: https://jolly-bush-0d2030500.3.azurestaticapps.net" >> $GITHUB_STEP_SUMMARY
          echo "- Supabase Ping: https://sarathi-scheduler.azurewebsites.net/api/supabase-ping" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Only components with changes were deployed" >> $GITHUB_STEP_SUMMARY
